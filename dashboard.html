<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Writta — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0B0B0E" />
<link rel="icon" href="icon-192.png" type="image/png" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">Writta</span>
      <span class="brand-sub">Shri Devdamanlal Technologies (OPC) Private Limited</span>
    </div>
    <div class="top-actions">
      <span id="user-label" class="save-indicator"></span>
      <button id="btn-logout" class="btn-icon" title="Logout">⎋</button>
    </div>
  </header>

  <div class="dash-wrap">
    <div class="dash-head">
      <div class="dash-title">મારા ગ્રંથો</div>
    </div>
    <div class="dash-sub">Your Library — દરેક ગ્રંથ સંપૂર્ણ સ્વતંત્ર structure સાથે</div>

    <div id="import-banner" class="import-banner" style="display:none">
      <span>જૂનું Writta v2 ગ્રંથ મળ્યું — તેને લાઇબ્રેરીમાં import કરવું છે?</span>
      <button id="btn-import">Import કરો</button>
    </div>

    <div id="book-grid" class="book-grid"></div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
